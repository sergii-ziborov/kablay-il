name: KablayIL
options:
  bundleIdPrefix: il.co.kablay
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "XMS5ZC28UJ"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "49"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  KablayIL:
    type: application
    platform: iOS
    sources:
      - path: KablayIL
    info:
      path: KablayIL/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: KABLAY IL
        CFBundleURLTypes:
          - CFBundleURLName: il.co.kablay.app
            CFBundleURLSchemes:
              - kablay
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.lifestyle
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        NSCameraUsageDescription: "KABLAY uses the camera to attach repair photos to your request and portfolio."
        NSPhotoLibraryUsageDescription: "KABLAY uses your photos for repair requests, chat, and specialist portfolios."
        NSFaceIDUsageDescription: "KABLAY uses Face ID to unlock your private requests, messages, and professional workspace."
        NSLocationWhenInUseUsageDescription: "KABLAY uses your location only when you ask to fill the service address and show it on the map."
        KABLAY_API_BASE_URL: "https://api.kablay.co.il"
        KABLAY_TRIAGE_BASE_URL: "https://kablay-triage.sergii-ziborov.workers.dev"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: il.co.kablay.app
        PRODUCT_NAME: KablayIL
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          # Free Personal Teams cannot provision APNs. Keep device previews
          # installable; Release/TestFlight retains the push entitlement.
          CODE_SIGN_ENTITLEMENTS: ""
        Release:
          CODE_SIGN_ENTITLEMENTS: KablayIL/KablayIL.entitlements
    scheme:
      testTargets:
        - KablayILTests
        - KablayILUITests
      gatherCoverageData: true
  KablayILTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KablayILTests
    dependencies:
      - target: KablayIL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: il.co.kablay.app.tests
        GENERATE_INFOPLIST_FILE: YES
  KablayILUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KablayILUITests
    dependencies:
      - target: KablayIL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: il.co.kablay.app.uitests
        GENERATE_INFOPLIST_FILE: YES
